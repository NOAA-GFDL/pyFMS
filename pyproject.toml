[build-system]
requires = ["scikit-build-core >= 0.3.3"]
build-backend = "scikit_build_core.build"

[project]
name = "pyfms"
version = "2026.03.00"
description = "A Python interface to the FMS Fortran software package."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# when updating the tested Python versions, please also update README.md,
dependencies = [
    "dacite",
    "h5netcdf",
    "numpy",
    "pyyaml",
    "mpi4py",
    "xarray",
    "netcdf4",
]
classifiers = [
    "Development Status :: 1 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-subtests",
    "coverage",
]
dev = [
    "pyfms[test]",
    "pre-commit",
    "flake8-pyproject",
]
extras = [
    "pyfms[test]",
    "pyfms[dev]",
]

[project.scripts]
generate-history = "pyfms.tools.generate_history:main"

[tool.aliases]

[tool.scikit-build]
wheel.expand-macos-universal-tags = true

[tool.scikit-build.cmake.define]
CMAKE_GENERATOR = "Unix Makefiles"

[tool.isort]
profile = "black"
line_length = "88"
force_grid_wrap = "0"
include_trailing_comma = "true"
multi_line_output = "3"
use_parentheses = "true"
lines_after_imports = "2"
default_section = "THIRDPARTY"
sections = "FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER"
known_first_party = "pyfms"
known_third_party = "pytest,dacite,xarray,numpy"

[tool.mypy]
ignore_missing_imports = true
follow_imports = "normal"
namespace_packages = true
strict_optional = false
warn_unreachable = true
explicit_package_bases = true

[tool.coverage.run]
parallel = true
branch = true
omit = [
    "tests/*",
    "__init__.py",
]
source_pkgs = ["pyfms"]

[tool.flake8]
exclude = ["docs"]
extend-ignore = ["E203","E501","W293","W503","E302","E203","F841", "F401", "F824", "B007"]
max-line-length = "88"

[tool.pytest]
markers = [
    "create",  # mark a test as create.
    "remove",  # mark test as remove.
    "parallel",  #  mark test as parallel.
    "convert_cf_order",  # mark test to transpose data from C to F ordered
]
